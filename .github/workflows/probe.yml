name: probe
on:
  push:
    branches: [takeover]
    paths: [tools/probe.py, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q yfinance pandas
      - run: python tools/probe.py
