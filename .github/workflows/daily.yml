name: daily put-vol refresh
on:
  schedule:
    - cron: "20 23 * * 0-4"   # 07:20 HKT Mon-Fri: after US close, JPX + HKEX files from the prior session
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: refresh, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -r requirements.txt
      - run: python screen.py
      - name: publish
        run: |
          git config user.name "IV dashboard"
          git config user.email "iv-dashboard@users.noreply.github.com"
          git add index.html data/store.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Daily put-vol refresh $(TZ=Asia/Hong_Kong date +%F)"
          git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"
